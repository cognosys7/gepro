# GEPRO en Apache85 (desarrollo: DESKTOP-U0A4LJ6):
#   puerto 8086: API dm_gepro (Power BI)
#   puerto 8087: aplicacion Laravel (solo desde esta maquina)
# El sitio antiguo se apago: GEPRO es laravel/ y de lo demas solo se publica la API.
# Instalar: copiar este archivo a C:\Apache24\conf\extra\httpd-gepro.conf, agregar al
# final de C:\Apache24\conf\httpd.conf la linea
#     Include conf/extra/httpd-gepro.conf
# y reiniciar Apache85 (PowerShell como administrador: Restart-Service Apache85).
# Antes de reiniciar hay que detener cualquier "php -S" en el 8087: si el puerto esta
# ocupado, Apache no arranca y se caen tambien CUBMIN y la API.
# Las reglas de seguridad globales de httpd.conf (bloqueo de .git, config/, vendor/,
# respaldos, ServerTokens, etc.) tambien se aplican a estos sitios.

Listen 8086

<VirtualHost *:8086>
    ServerName localhost:8086
    DocumentRoot "C:/www/gepro"

    # Nada del proyecto se publica, salvo dm_gepro (la URL /dm_gepro/ no cambia)
    <Directory "C:/www/gepro">
        Options None
        AllowOverride None
        Require all denied
    </Directory>
    <Directory "C:/www/gepro/dm_gepro">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    DirectoryIndex index.php

    # Credenciales fuera del sitio (config/cargar_config.php)
    SetEnv GEPRO_CONFIG "C:/gepro_config/config.php"

    # PHP solo lee y escribe en la API, su configuracion, temporales, logs y credenciales
    php_admin_value open_basedir "C:\www\gepro\dm_gepro\;C:\www\gepro\config\;C:\php85\tmp\;C:\Apache24\logs\;C:\gepro_config\"
</VirtualHost>

# Solo desde esta maquina, como el servidor de desarrollo: el .env tiene APP_DEBUG=true
Listen 127.0.0.1:8087
Listen [::1]:8087

<VirtualHost *:8087>
    ServerName localhost:8087
    DocumentRoot "C:/www/gepro/laravel/public"

    # Solo public/ queda a la vista; las rutas salen de su .htaccess
    <Directory "C:/www/gepro/laravel/public">
        Options -Indexes +FollowSymLinks
        AllowOverride FileInfo Options=MultiViews,Indexes
        Require all granted
    </Directory>
    DirectoryIndex index.php

    # La regla global bloquea toda URL con /vendor/; estos son los iconos de public/vendor
    <Location "/vendor/fontawesome/">
        Require all granted
    </Location>

    # PHP solo lee y escribe en la aplicacion, los archivos subidos, temporales, logs y credenciales
    php_admin_value open_basedir "C:\www\gepro\laravel\;C:\www\gepro\SGPAM_archivos\;C:\php85\tmp\;C:\Apache24\logs\;C:\gepro_config\"
</VirtualHost>
