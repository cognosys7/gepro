# GEPRO en Apache85, puerto 8086 (desarrollo: DESKTOP-U0A4LJ6).
# Instalar: copiar este archivo a C:\Apache24\conf\extra\httpd-gepro.conf, agregar al
# final de C:\Apache24\conf\httpd.conf la linea
#     Include conf/extra/httpd-gepro.conf
# y reiniciar Apache85 (PowerShell como administrador: Restart-Service Apache85).
# Las reglas de seguridad globales de httpd.conf (bloqueo de .git, config/, vendor/,
# respaldos, ServerTokens, etc.) tambien se aplican a este sitio.

Listen 8086

<VirtualHost *:8086>
    ServerName localhost:8086
    DocumentRoot "C:/www/gepro"

    <Directory "C:/www/gepro">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    DirectoryIndex index.php

    # Credenciales fuera del sitio (config/cargar_config.php)
    SetEnv GEPRO_CONFIG "C:/gepro_config/config.php"

    # PHP solo lee y escribe en el sitio, temporales, logs y credenciales
    php_admin_value open_basedir "C:\www\gepro\;C:\php85\tmp\;C:\Apache24\logs\;C:\gepro_config\"

    # CUBMIN (8085) y GEPRO comparten "localhost" y el navegador no separa las
    # cookies por puerto: cada sistema necesita su propia cookie de sesion
    php_value session.name GEPROSESSID
</VirtualHost>
